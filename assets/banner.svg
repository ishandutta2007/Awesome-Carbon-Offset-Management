<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="50%" stop-color="#0a2e23" />
      <stop offset="100%" stop-color="#04120e" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e3e" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#062e24" stop-opacity="0.65" />
    </linearGradient>

    <radialGradient id="orbGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.12" />
      <circle cx="40" cy="40" r="1.5" fill="#34d399" fill-opacity="0.2" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .gradient-span {
        fill: url(#accentGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        fill: #a7f3d0;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #6ee7b7;
      }
      .code-font {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      
      /* Subtle animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes floatMedium {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }

      .pulse-orb {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatMedium 7s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 6 4;
        animation: dashFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs (in background) -->
  <circle cx="150" cy="100" r="180" fill="url(#orbGreen)" class="pulse-orb" />
  <circle cx="1050" cy="300" r="220" fill="url(#orbTeal)" class="pulse-orb" style="animation-delay: -3s;" />

  <!-- Animated Connection Streams (Background decoration) -->
  <path d="M 80 340 C 350 390, 750 310, 1120 360" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" class="flow-path" />
  <path d="M 120 80 C 480 30, 800 120, 1100 60" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.25" class="flow-path" style="animation-duration: 4s;" />

  <!-- Animated Floating Eco Cards in safe right-hand zone -->
  <g class="floating-node-1">
    <g transform="translate(850, 70)">
      <rect width="270" height="70" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="35" cy="35" r="16" fill="#10b981" fill-opacity="0.2" />
      <text x="35" y="41" text-anchor="middle" font-size="16">🌱</text>
      <text x="65" y="32" class="tag-text" font-weight="700">Digital MRV &amp; Registries</text>
      <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94a3b8">UNDP DPG • Verified Credits</text>
    </g>
  </g>

  <g class="floating-node-2">
    <g transform="translate(880, 160)">
      <rect width="250" height="70" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="35" cy="35" r="16" fill="#06b6d4" fill-opacity="0.2" />
      <text x="35" y="41" text-anchor="middle" font-size="16">⚡</text>
      <text x="65" y="32" class="tag-text" fill="#67e8f9" font-weight="700">Programmable Carbon</text>
      <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94a3b8">Toucan • KlimaDAO • APIs</text>
    </g>
  </g>

  <g class="floating-node-1">
    <g transform="translate(840, 250)">
      <rect width="280" height="70" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="35" cy="35" r="16" fill="#34d399" fill-opacity="0.2" />
      <text x="35" y="41" text-anchor="middle" font-size="16">🛡️</text>
      <text x="65" y="32" class="tag-text" fill="#a7f3d0" font-weight="700">Permanent CDR &amp; Offsets</text>
      <text x="65" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#94a3b8">DAC • Biochar • Super-Pollutants</text>
    </g>
  </g>

  <!-- Foreground Title and Core Branding (Always in crisp foreground) -->
  <g transform="translate(80, 110)">
    <!-- Pill Badge -->
    <rect width="235" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#34d399" />
    <text x="28" y="19" class="tag-text code-font" font-size="11.5">CLIMATE TECH &amp; CARBON MRV</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Awesome <tspan class="gradient-span">Carbon Offset</tspan>
    </text>
    <text x="0" y="132" class="title-text">
      Management <tspan font-size="34">🌍</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text">
      A curated index of carbon credit procurement platforms, digital MRV toolkits,
    </text>
    <text x="0" y="202" class="subtitle-text">
      on-chain climate registries, and open-source carbon accounting engines.
    </text>

    <!-- Feature Mini Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <rect width="115" height="26" rx="6" fill="#0f3d30" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
      <text x="57" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#a7f3d0" font-weight="600">🌿 SaaS Portfolios</text>

      <!-- Badge 2 -->
      <g transform="translate(125, 0)">
        <rect width="125" height="26" rx="6" fill="#0f3d30" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" />
        <text x="62" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#a7f3d0" font-weight="600">⭐ Open-Source MRV</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(260, 0)">
        <rect width="125" height="26" rx="6" fill="#0f3d30" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />
        <text x="62" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#67e8f9" font-weight="600">🔗 Article 6 &amp; APIs</text>
      </g>
    </g>
  </g>
</svg>
